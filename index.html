<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DPI Customer Experience Portal</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fa;
      color: #172033;
    }

    .header {
      min-height: 135px;
      display: flex;
      align-items: center;
      padding: 30px 8%;
      color: white;

      background:
        linear-gradient(
          110deg,
          #064a69 0%,
          #07597c 45%,
          #35679c 100%
        );
    }

    .header-content {
      max-width: 1200px;
      width: 100%;
      margin: auto;
    }

    .eyebrow {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 3px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: 34px;
    }

    main {
      max-width: 1000px;
      margin: 60px auto;
      padding: 0 25px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 35px;
      box-shadow: 0 6px 24px rgba(0,0,0,.08);
    }

    .success {
      color: #178447;
      font-weight: 700;
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="header-content">

      <div class="eyebrow">
        DPI CUSTOMER EXPERIENCE PORTAL
      </div>

      <h1>
        Share your voice. Help us build better.
      </h1>

    </div>
  </header>

  <main>

    <div class="card">

      <h2>Customer Experience Portal</h2>

      <p class="success">
        ✓ GitHub frontend is working.
      </p>

      <p>
        This is the new GitHub-hosted frontend for the
        DPI Customer Experience Portal.
      </p>

    </div>

  </main>

</body>
</html>
